                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: 修改当前用户资料
      description: 只允许修改显示名称、邮箱、电话、语言和时区，使用 rowVersion 防止覆盖并发更新。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserRequest"
      responses:
        "200":
          description: 资料已更新。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/me/sessions:
    get:
      operationId: listCurrentUserSessions
      tags: [Users]
      summary: 分页查询当前用户会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: 当前用户会话列表，包含活动和历史会话。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/v1/users/me/sessions/{sessionId}:
    delete:
      operationId: revokeCurrentUserSession
      tags: [Users]
      summary: 撤销当前用户的一条会话
      description: 只能撤销属于当前用户的会话；重复撤销保持成功。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "204":
          description: 会话已撤销或原本已经失效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [UserAdministration]
      summary: 分页查询用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: systemRole
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SystemRole"
      responses:
        "200":
          description: 用户列表，按创建时间和 userId 稳定倒序。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [UserAdministration]
      summary: 创建本地密码用户
      description: 用户、PASSWORD 凭据、安全版本、Outbox 和幂等结果在同一事务写入。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
