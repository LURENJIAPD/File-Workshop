      summary: 撤销资源授权
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RevokePermissionGrantRequest" } } }
      responses:
        "200":
          description: 授权已撤销。
          content: { application/json: { schema: { $ref: "#/components/schemas/PermissionGrantResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/permissions/evaluate:
    post:
      operationId: evaluatePermission
      tags: [Permissions]
      summary: 判断当前用户的资源动作权限
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PermissionEvaluationRequest" } } }
      responses:
        "200":
          description: 最终授权结果；默认拒绝以 allowed=false 表示，不泄露资源细节。
          content: { application/json: { schema: { $ref: "#/components/schemas/PermissionEvaluationResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }

  /api/v1/permissions/batch-evaluate:
    post:
      operationId: batchEvaluatePermissions
      tags: [Permissions]
      summary: 批量判断当前用户的资源动作权限
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BatchPermissionEvaluationRequest" } } }
      responses:
        "200":
          description: 保持请求顺序返回的最终授权结果。
          content: { application/json: { schema: { $ref: "#/components/schemas/BatchPermissionEvaluationResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }

  /api/v1/permissions/resources/{resourceType}/{resourceId}/break-inheritance:
    parameters:
