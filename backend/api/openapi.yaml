      responses:
        "200":
          description: 委派能力判定结果；无授权时返回 allowed=false。
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminDelegationEvaluationResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }

  /api/v1/permissions/resources/{resourceType}/{resourceId}:
