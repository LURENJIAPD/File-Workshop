    post:
      operationId: breakPermissionInheritance
      tags: [Permissions]
      summary: 断开文件夹或文档的 ACL 继承
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangePermissionInheritanceRequest" } } }
      responses:
        "200":
          description: 继承模式已设为 BREAK。
          content: { application/json: { schema: { $ref: "#/components/schemas/PermissionInheritanceResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/permissions/resources/{resourceType}/{resourceId}/restore-inheritance:
    parameters:
      - { $ref: "#/components/parameters/PermissionResourceTypePath" }
      - { $ref: "#/components/parameters/PermissionResourceIdPath" }
    post:
      operationId: restorePermissionInheritance
      tags: [Permissions]
      summary: 恢复文件夹或文档的 ACL 继承
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangePermissionInheritanceRequest" } } }
      responses:
        "200":
          description: 继承模式已设为 INHERIT。
          content: { application/json: { schema: { $ref: "#/components/schemas/PermissionInheritanceResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/background/outbox-events:
    get:
      operationId: listBackgroundOutboxEvents
      tags: [BackgroundAdministration]
      summary: List Outbox events for operations.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BackgroundOutboxStatus" }
        - name: eventType
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Outbox event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundOutboxEventListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/background/outbox-events/{outboxEventId}/retry:
    post:
      operationId: retryBackgroundOutboxEvent
      tags: [BackgroundAdministration]
      summary: Retry a failed or dead Outbox event.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OutboxEventIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryBackgroundItemRequest"
      responses:
        "200":
          description: Outbox event moved back to PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundOutboxEventResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/background/jobs:
    get:
      operationId: listBackgroundJobs
      tags: [BackgroundAdministration]
      summary: List background jobs for operations.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BackgroundJobStatus" }
        - name: jobType
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Background job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJobListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/background/jobs/{backgroundJobId}/retry:
    post:
      operationId: retryBackgroundJob
      tags: [BackgroundAdministration]
      summary: Retry a failed or dead background job.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BackgroundJobIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryBackgroundItemRequest"
      responses:
        "200":
          description: Background job moved back to PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJobResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 短期访问 JWT。浏览器不应将其持久化到 LocalStorage。
    sessionCookie:
      type: apiKey
      in: cookie
      name: file_workshop_access
      description: 浏览器短期访问 JWT Cookie，使用 HttpOnly 和 SameSite；生产环境必须使用 Secure。
    refreshCookie:
      type: apiKey
      in: cookie
      name: file_workshop_refresh
      description: 只用于刷新和注销的轮换 Refresh Token Cookie，使用 HttpOnly 和 SameSite；生产环境必须使用 Secure。

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: 从 1 开始的页码。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      description: 每页数量，最大 200。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 可重试写请求的稳定幂等键。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationIdPath:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipIdPath:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpaceIdPath:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DirectoryEntryIdPath:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanIdPath:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DelegationIdPath:
      name: delegationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantIdPath:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PermissionResourceTypePath:
      name: resourceType
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PermissionResourceType" }
    PermissionResourceIdPath:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OutboxEventIdPath:
      name: outboxEventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BackgroundJobIdPath:
      name: backgroundJobId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: 本次请求的稳定追踪标识。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuthSetCookie:
      description: 可能出现多次，分别设置或清除访问 Cookie 和 Refresh Token Cookie。
      schema:
        type: string
    NoStore:
      description: 认证响应不得被共享或浏览器缓存保存。
      schema:
        type: string
        const: no-store

  responses:
    InvalidRequest:
      description: 请求 JSON 或字段不符合契约。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthRequired:
      description: 未提供有效认证信息、访问令牌过期或会话已经失效。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: 用户名或密码错误；响应不区分用户是否存在。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountLocked:
      description: 账号被管理员锁定，或在锁定窗口内连续失败次数达到阈值。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecurityRejected:
      description: 浏览器请求的 Origin 不在允许列表中，拒绝可能的跨站请求伪造。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: IP 或账号短时间请求过多。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: 建议重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 当前用户没有执行该管理操作的权限。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在或对当前用户不可见。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 唯一值、幂等键、用户状态或 rowVersion 发生冲突。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    BackgroundOutboxStatus:
      type: string
      enum: [PENDING, PROCESSING, PUBLISHED, FAILED, DEAD]

    BackgroundJobStatus:
      type: string
      enum: [PENDING, PROCESSING, SUCCESS, FAILED, DEAD, CANCELLED, SKIPPED]

    BackgroundOutboxEvent:
      type: object
      additionalProperties: false
      required: [outboxEventId, aggregateType, aggregateId, aggregateVersion, eventType, eventSchemaVersion, payload, deduplicationKey, priority, status, attemptCount, maxAttempts, availableAt, createdAt, updatedAt, rowVersion]
      properties:
        outboxEventId: { type: string, format: uuid }
        aggregateType: { type: string, minLength: 1, maxLength: 64 }
        aggregateId: { type: string, format: uuid }
        aggregateVersion: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string, minLength: 1, maxLength: 128 }
        eventSchemaVersion: { type: integer, minimum: 1 }
        payload:
          type: object
          additionalProperties: true
        deduplicationKey: { type: string, minLength: 1, maxLength: 256 }
        correlationId: { type: string, format: uuid }
        causationId: { type: string, format: uuid }
        priority: { type: integer }
        status: { $ref: "#/components/schemas/BackgroundOutboxStatus" }
        attemptCount: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        availableAt: { type: string, format: date-time }
        lockedBy: { type: string, maxLength: 256 }
        lockedAt: { type: string, format: date-time }
        leaseUntil: { type: string, format: date-time }
        nextRetryAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        lastErrorCode: { type: string, maxLength: 64 }
        lastErrorSummary: { type: string, maxLength: 512 }
        rowVersion: { type: integer, format: int64, minimum: 1 }

    BackgroundJob:
      type: object
      additionalProperties: false
      required: [backgroundJobId, jobType, payloadSchemaVersion, payload, deduplicationKey, priority, status, attemptCount, maxAttempts, availableAt, createdAt, updatedAt, rowVersion]
      properties:
        backgroundJobId: { type: string, format: uuid }
        jobType: { type: string, minLength: 1, maxLength: 128 }
        targetDocumentId: { type: string, format: uuid }
        targetDocumentVersionId: { type: string, format: uuid }
        targetStorageObjectId: { type: string, format: uuid }
        payloadSchemaVersion: { type: integer, minimum: 1 }
        payload:
          type: object
          additionalProperties: true
        deduplicationKey: { type: string, minLength: 1, maxLength: 256 }
        priority: { type: integer }
        status: { $ref: "#/components/schemas/BackgroundJobStatus" }
        attemptCount: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
