        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/background/summary:
    get:
      operationId: getBackgroundAdministrationSummary
      tags: [BackgroundAdministration]
      summary: Get background operations status counts.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Background operations status counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundAdministrationSummaryResponse"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/background/jobs:
    get:
      operationId: listBackgroundJobs
      tags: [BackgroundAdministration]
      summary: List background jobs for operations.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BackgroundJobStatus" }
        - name: jobType
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Background job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJobListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/background/jobs/batch-retry:
    post:
      operationId: batchRetryBackgroundJobs
      tags: [BackgroundAdministration]
      summary: Retry failed or dead background jobs in a controlled batch.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchBackgroundJobOperationRequest"
      responses:
        "200":
          description: Batch retry results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBackgroundJobOperationResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/background/jobs/batch-cancel:
    post:
      operationId: batchCancelBackgroundJobs
      tags: [BackgroundAdministration]
      summary: Cancel pending, failed, or dead background jobs in a controlled batch.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchBackgroundJobOperationRequest"
      responses:
        "200":
          description: Batch cancel results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBackgroundJobOperationResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/background/jobs/{backgroundJobId}/retry:
    post:
      operationId: retryBackgroundJob
      tags: [BackgroundAdministration]
      summary: Retry a failed or dead background job.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BackgroundJobIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryBackgroundItemRequest"
      responses:
        "200":
          description: Background job moved back to PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJobResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/background/jobs/{backgroundJobId}/cancel:
    post:
      operationId: cancelBackgroundJob
      tags: [BackgroundAdministration]
      summary: Cancel a pending, failed, or dead background job.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BackgroundJobIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBackgroundJobRequest"
      responses:
        "200":
          description: Background job moved to CANCELLED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJobResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 短期访问 JWT。浏览器不应将其持久化到 LocalStorage。
    sessionCookie:
      type: apiKey
      in: cookie
      name: file_workshop_access
      description: 浏览器短期访问 JWT Cookie，使用 HttpOnly 和 SameSite；生产环境必须使用 Secure。
    refreshCookie:
      type: apiKey
      in: cookie
      name: file_workshop_refresh
      description: 只用于刷新和注销的轮换 Refresh Token Cookie，使用 HttpOnly 和 SameSite；生产环境必须使用 Secure。

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: 从 1 开始的页码。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      description: 每页数量，最大 200。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 可重试写请求的稳定幂等键。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationIdPath:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipIdPath:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpaceIdPath:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DirectoryEntryIdPath:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentVersionIdPath:
      name: documentVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareIdPath:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecycleItemIdPath:
      name: recycleItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreservationHoldIdPath:
      name: preservationHoldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanIdPath:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DelegationIdPath:
      name: delegationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantIdPath:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PermissionResourceTypePath:
      name: resourceType
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PermissionResourceType" }
    PermissionResourceIdPath:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditEventIdPath:
      name: auditEventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OutboxEventIdPath:
      name: outboxEventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadSessionIdPath:
      name: uploadSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BackgroundJobIdPath:
      name: backgroundJobId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: 本次请求的稳定追踪标识。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuthSetCookie:
      description: 可能出现多次，分别设置或清除访问 Cookie 和 Refresh Token Cookie。
      schema:
        type: string
    NoStore:
      description: 认证响应不得被共享或浏览器缓存保存。
      schema:
        type: string
        const: no-store

  responses:
    InvalidRequest:
      description: 请求 JSON 或字段不符合契约。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthRequired:
      description: 未提供有效认证信息、访问令牌过期或会话已经失效。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: 用户名或密码错误；响应不区分用户是否存在。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountLocked:
      description: 账号被管理员锁定，或在锁定窗口内连续失败次数达到阈值。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecurityRejected:
      description: 浏览器请求的 Origin 不在允许列表中，拒绝可能的跨站请求伪造。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: IP 或账号短时间请求过多。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: 建议重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 当前用户没有执行该管理操作的权限。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在或对当前用户不可见。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 唯一值、幂等键、用户状态或 rowVersion 发生冲突。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    DocumentVersionSourceType:
      type: string
      enum: [WEB, WEBDAV, MIGRATION, AGENT, RESTORE]

    DocumentVersion:
      type: object
      additionalProperties: false
      required: [documentVersionId, documentId, versionNumber, storageObjectId, sizeBytes, sha256Hex, mimeType, sourceType, createdByUserId, createdAt]
      properties:
        documentVersionId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        versionNumber: { type: integer, format: int64 }
        storageObjectId: { type: string, format: uuid }
        sizeBytes: { type: integer, format: int64 }
        sha256Hex:
          type: string
          pattern: "^[0-9a-f]{64}$"
        mimeType: { type: string }
        changeNote: { type: string }
        sourceType: { $ref: "#/components/schemas/DocumentVersionSourceType" }
        restoredFromVersionId: { type: string, format: uuid }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    DocumentVersionListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, requestId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentVersion" }
        page: { $ref: "#/components/schemas/Page" }
        pageSize: { $ref: "#/components/schemas/PageSize" }
        total: { type: integer, format: int64 }
        requestId: { type: string }

    DocumentVersionResponse:
      type: object
      additionalProperties: false
      required: [version, requestId]
      properties:
        version: { $ref: "#/components/schemas/DocumentVersion" }
        requestId: { type: string }

    RestoreDocumentVersionRequest:
      type: object
      additionalProperties: false
      required: [rowVersion]
      properties:
        rowVersion: { type: integer, format: int64, minimum: 1 }
        changeNote: { type: string, minLength: 1, maxLength: 2000 }

    DocumentLockSource:
      type: string
      enum: [WEB, WEBDAV, OFFICE, AGENT]

    DocumentLockStatus:
      type: string
      enum: [ACTIVE, RELEASED, EXPIRED, FORCED]

    DocumentLock:
      type: object
      additionalProperties: false
      required: [documentLockId, documentId, userId, fencingToken, source, status, acquiredAt, heartbeatAt, expiresAt, createdAt, updatedAt, rowVersion]
      properties:
        documentLockId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fencingToken: { type: integer, format: int64 }
        source: { $ref: "#/components/schemas/DocumentLockSource" }
        status: { $ref: "#/components/schemas/DocumentLockStatus" }
        acquiredAt: { type: string, format: date-time }
        heartbeatAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        releasedByUserId: { type: string, format: uuid }
        releaseReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer, format: int64 }

    DocumentLockResponse:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        lock:
          anyOf:
            - $ref: "#/components/schemas/DocumentLock"
            - type: "null"
        requestId: { type: string }

    AcquireDocumentLockRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { $ref: "#/components/schemas/DocumentLockSource" }
        ttlSeconds: { type: integer, minimum: 60, maximum: 86400 }

    AcquireDocumentLockResponse:
      type: object
      additionalProperties: false
      required: [lock, lockToken, requestId]
      properties:
        lock: { $ref: "#/components/schemas/DocumentLock" }
        lockToken:
          type: string
          description: 仅本次响应返回的明文锁令牌；服务端只保存 SHA-256 摘要。
        requestId: { type: string }

    HeartbeatDocumentLockRequest:
      type: object
      additionalProperties: false
      required: [lockToken, rowVersion]
      properties:
        lockToken: { type: string, minLength: 32, maxLength: 512 }
        rowVersion: { type: integer, format: int64, minimum: 1 }
        ttlSeconds: { type: integer, minimum: 60, maximum: 86400 }

    ReleaseDocumentLockRequest:
      type: object
      additionalProperties: false
      required: [lockToken, rowVersion]
      properties:
        lockToken: { type: string, minLength: 32, maxLength: 512 }
        rowVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 512 }

    ForceReleaseDocumentLockRequest:
      type: object
      additionalProperties: false
      required: [reason, rowVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
        rowVersion: { type: integer, format: int64, minimum: 1 }

    ShareResourceType:
      type: string
      enum: [DOCUMENT, FOLDER]

    ShareTargetKind:
      type: string
      enum: [USER, ORGANIZATION, SPACE, LINK]

    CreateShareTargetKind:
      type: string
      enum: [USER, ORGANIZATION, LINK]

    ShareStatus:
      type: string
      enum: [ACTIVE, EXPIRED, REVOKED, SUSPENDED, SOURCE_UNAVAILABLE]

    ShareAction:
      type: string
      enum: [READ_METADATA, PREVIEW, DOWNLOAD, WRITE_CONTENT]

    Share:
      type: object
      additionalProperties: false
      required: [shareId, sourceType, sourceId, creatorUserId, targetKind, allowReshare, actions, validFrom, status, createdAt, updatedAt, rowVersion]
      properties:
        shareId: { type: string, format: uuid }
        sourceType: { $ref: "#/components/schemas/ShareResourceType" }
        sourceId: { type: string, format: uuid }
        creatorUserId: { type: string, format: uuid }
        targetKind: { $ref: "#/components/schemas/ShareTargetKind" }
        targetUserId: { type: string, format: uuid }
        targetOrganizationId: { type: string, format: uuid }
        targetSpaceId: { type: string, format: uuid }
        allowReshare: { type: boolean }
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/ShareAction" }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ShareStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        revokedByUserId: { type: string, format: uuid }
        revokeReason: { type: string }
        rowVersion: { type: integer, format: int64, minimum: 1 }

    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [sourceType, sourceId, targetKind, actions]
      properties:
        sourceType: { $ref: "#/components/schemas/ShareResourceType" }
        sourceId: { type: string, format: uuid }
        targetKind: { $ref: "#/components/schemas/CreateShareTargetKind" }
        targetUserId: { type: string, format: uuid }
        targetOrganizationId: { type: string, format: uuid }
        targetSpaceId: { type: string, format: uuid }
        allowReshare: { type: boolean, default: false }
        actions:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/ShareAction" }
        validUntil: { type: string, format: date-time }
        note:
          type: string
          minLength: 1
          maxLength: 512

    UpdateShareRequest:
      type: object
      additionalProperties: false
      required: [rowVersion]
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/ShareAction" }
        validUntil:
          type: string
          format: date-time
          description: 设置新的到期时间；当前周期暂不支持通过 null 清空到期时间。
        allowReshare: { type: boolean }
        rowVersion: { type: integer, format: int64, minimum: 1 }

    RevokeShareRequest:
      type: object
      additionalProperties: false
      required: [reason, rowVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
        rowVersion: { type: integer, format: int64, minimum: 1 }

    ShareListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, requestId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Share" }
        page: { $ref: "#/components/schemas/Page" }
        pageSize: { $ref: "#/components/schemas/PageSize" }
        total: { type: integer, format: int64, minimum: 0 }
        requestId: { type: string }

    ShareResponse:
      type: object
      additionalProperties: false
      required: [share, requestId]
      properties:
        share: { $ref: "#/components/schemas/Share" }
        shareToken:
          type: string
          description: 仅 LINK 共享创建成功时返回一次的明文内部链接令牌；服务端只保存 SHA-256 摘要。
        requestId: { type: string }

    OpenShareRequest:
      type: object
      additionalProperties: false
      properties:
        shareToken:
          type: string
          minLength: 32
          maxLength: 512

    OpenShareResponse:
      type: object
      additionalProperties: false
      required: [share, sourceType, sourceId, actions, requestId]
      properties:
        share: { $ref: "#/components/schemas/Share" }
        sourceType: { $ref: "#/components/schemas/ShareResourceType" }
        sourceId: { type: string, format: uuid }
        actions:
          type: array
          items: { $ref: "#/components/schemas/ShareAction" }
        requestId: { type: string }

    UploadIntent:
      type: string
      enum: [CREATE, NEW_VERSION]

    UploadSessionStatus:
      type: string
      enum: [INITIATED, UPLOADING, COMPLETING, COMPLETED, ABORTED, EXPIRED, FAILED]

    CreateUploadSessionRequest:
      type: object
      additionalProperties: false
      required: [spaceId, folderId, uploadIntent, fileName, declaredSizeBytes, partSizeBytes]
      properties:
        spaceId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        targetDocumentId: { type: string, format: uuid }
        uploadIntent: { $ref: "#/components/schemas/UploadIntent" }
        fileName: { type: string, minLength: 1, maxLength: 512 }
        declaredSizeBytes: { type: integer, format: int64, minimum: 1 }
        declaredSha256Hex:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        declaredMimeType: { type: string, minLength: 1, maxLength: 256 }
        partSizeBytes: { type: integer, format: int64, minimum: 5242880 }
        expectedCurrentVersionId: { type: string, format: uuid }
        expectedLockFencingToken: { type: integer, format: int64, minimum: 1 }
        lockTokenHashHex:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"

    UploadSession:
      type: object
      additionalProperties: false
      required: [uploadSessionId, userId, spaceId, folderId, quotaReservationId, uploadIntent, fileName, normalizedName, declaredSizeBytes, partSizeBytes, expectedPartCount, status, expiresAt, createdAt, updatedAt, rowVersion]
      properties:
        uploadSessionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        quotaReservationId: { type: string, format: uuid }
        targetDocumentId: { type: string, format: uuid }
        uploadIntent: { $ref: "#/components/schemas/UploadIntent" }
        fileName: { type: string }
        normalizedName: { type: string }
        declaredSizeBytes: { type: integer, format: int64 }
        declaredSha256Hex: { type: string }
        declaredMimeType: { type: string }
        partSizeBytes: { type: integer, format: int64 }
        expectedPartCount: { type: integer }
        expectedCurrentVersionId: { type: string, format: uuid }
        expectedLockFencingToken: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/UploadSessionStatus" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        failureCode: { type: string }
        resultDocumentId: { type: string, format: uuid }
        resultVersionId: { type: string, format: uuid }
        rowVersion: { type: integer, format: int64 }

    UploadSessionResponse:
      type: object
      additionalProperties: false
