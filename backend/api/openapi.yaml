openapi: 3.1.0
info:
  title: File Workshop API
  version: 0.1.0
  description: File Workshop V1.0 REST API 工作契约。业务 API 使用 /api/v1，平台健康检查为部署探针例外。
servers:
  - url: /

tags:
  - name: Health
    description: 应用存活与就绪探针，不产生业务审计事件。
  - name: Authentication
    description: 登录、会话检查、Refresh Token 轮换和注销；只建立身份上下文，不判断文件资源权限。
  - name: Users
    description: 当前用户资料和本人会话管理。
  - name: UserAdministration
    description: SYSTEM_ADMIN 用户生命周期管理；所有写操作执行资源级授权和并发校验。
  - name: Organizations
    description: 当前用户可见的组织关系和个人空间；成员关系本身不授予文件权限。
  - name: OrganizationAdministration
    description: SYSTEM_ADMIN 维护组织树、成员关系和受控重组计划。
  - name: SpaceAdministration
    description: SYSTEM_ADMIN 维护个人、组织和公共空间的容量、配置与状态。
  - name: AdministrationDelegation
    description: 组织及其子树的管理能力委派；管理委派与普通文件 ACL 严格分离。
  - name: Permissions
    description: 全系统唯一资源授权判定入口；采用显式允许、继承和默认拒绝，不支持显式 DENY。
  - name: FileDirectory
    description: 文件夹树、Document 稳定身份和统一目录命名空间；不处理对象存储上传下载数据面。

  - name: FileTransfer
    description: 上传会话、分片预签名和对象存储控制面；二进制数据默认直传 S3 兼容对象存储。

  - name: VersionConcurrency
    description: 不可变文件版本、历史版本恢复和文件级租约锁；恢复创建新版本，不覆盖历史。

  - name: Sharing
    description: 内部用户、组织、空间和登录态链接共享；共享是独立允许来源，不写入普通 ACL。

  - name: Lifecycle
    description: 回收站、恢复和永久清理元数据控制；真实对象清理由后台任务在对象存储可用后完成。

  - name: Search
    description: 权限安全的文件名、目录名和文档元数据搜索；全文、OCR 和语义搜索由后续索引周期接入。

  - name: Audit
    description: Audit event query, integrity status and controlled verification.
  - name: BackgroundAdministration
    description: SYSTEM_ADMIN background job and Outbox operations.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: 检查进程是否存活
      description: 只确认 HTTP 进程能够响应，不访问外部依赖。
      responses:
        "200":
          description: 进程存活。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: 检查节点是否可以接收流量
      description: PostgreSQL 是必需依赖；Redis 故障时允许降级；对象存储暂缓期间明确报告 disabled。当前组件键名固定为 postgresql、redis、objectStorage。
      responses:
        "200":
          description: 节点就绪；响应 status 可能为 ok 或 degraded。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 必需依赖不可用，节点未就绪。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: 使用用户名和密码登录
      description: >-
        成功后返回短期 Bearer 访问令牌，并设置访问 Cookie 和只用于刷新/注销的 Refresh Token Cookie。
        Refresh Token 不进入响应正文，数据库只保存其 SHA-256 摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，会话和第一代 Refresh Token 已在同一事务创建。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/spaces/{spaceId}/entries:
    get:
      operationId: listDirectoryEntries
      tags: [FileDirectory]
      summary: 分页列出目录项
      description: 省略 parentFolderId 时列出空间根目录子项；若空间根目录尚未初始化且没有内容，返回空列表。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SpaceIdPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: parentFolderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: entryType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DirectoryEntryType" }
        - name: lifecycleStatus
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DirectoryLifecycleStatus" }
      responses:
        "200":
          description: 目录项列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/spaces/{spaceId}/folders:
    post:
      operationId: createFolder
      tags: [FileDirectory]
      summary: 创建文件夹
      description: 省略 parentFolderId 时在空间根目录下创建；必要时同事务初始化空间根文件夹。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SpaceIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: 文件夹已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/spaces/{spaceId}/documents:
    post:
      operationId: createDocument
      tags: [FileDirectory]
      summary: 创建 Document 稳定身份
      description: 当前只创建文档目录身份和元数据，占位文档 availabilityStatus 为 BLOCKED；实际版本和对象存储内容由后续上传模块写入。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SpaceIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Document 身份已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/uploads:
    post:
      operationId: createUploadSession
      tags: [FileTransfer]
      summary: 创建上传会话
      description: 创建 S3 Multipart 上传会话、预留 Space 配额并写入 upload_sessions；对象存储未启用时返回冲突错误，不创建会话。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: 上传会话已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/uploads/{uploadSessionId}:
    get:
      operationId: getUploadSession
      tags: [FileTransfer]
      summary: 获取上传会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadSessionIdPath"
      responses:
        "200":
          description: 上传会话详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/uploads/{uploadSessionId}/parts/{partNumber}/presign:
    post:
      operationId: presignUploadPart
      tags: [FileTransfer]
      summary: 获取上传分片预签名 URL
      description: 返回短有效期 PUT 预签名 URL；客户端直接向对象存储上传二进制分片。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadSessionIdPath"
        - name: partNumber
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: 分片上传预签名信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUploadPartResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/uploads/{uploadSessionId}/abort:
    post:
      operationId: abortUploadSession
      tags: [FileTransfer]
      summary: 取消上传会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadSessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortUploadSessionRequest"
      responses:
        "200":
          description: 上传会话已取消。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/documents/{documentId}/versions:
    get:
      operationId: listDocumentVersions
      tags: [VersionConcurrency]
      summary: 分页查询文档版本
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: 文档版本列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/documents/{documentId}/versions/{documentVersionId}/restore:
    post:
      operationId: restoreDocumentVersion
      tags: [VersionConcurrency]
      summary: 将历史版本恢复为新版本
      description: 恢复不会修改历史版本；服务端复制历史版本的存储对象引用，创建新的 document_versions 行并切换 documents.current_version_id。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/DocumentVersionIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreDocumentVersionRequest"
      responses:
        "201":
          description: 历史版本已恢复为新的当前版本。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/documents/{documentId}/lock:
    get:
      operationId: getDocumentLock
      tags: [VersionConcurrency]
      summary: 查询文档当前锁状态
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: 文档锁状态；无活动锁时 lock 为 null。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLockResponse"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: acquireDocumentLock
      tags: [VersionConcurrency]
      summary: 获取文件级租约锁
      description: 获取锁会生成一次性明文 lockToken 并只返回本次响应；数据库仅保存 SHA-256 摘要和单调 fencingToken。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquireDocumentLockRequest"
      responses:
        "201":
          description: 锁已获取。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireDocumentLockResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: releaseDocumentLock
      tags: [VersionConcurrency]
      summary: 释放文件级租约锁
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseDocumentLockRequest"
      responses:
        "200":
          description: 锁已释放。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLockResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/documents/{documentId}/lock/heartbeat:
    post:
      operationId: heartbeatDocumentLock
      tags: [VersionConcurrency]
      summary: 续租文件级租约锁
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatDocumentLockRequest"
      responses:
        "200":
          description: 锁已续租。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLockResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/documents/{documentId}/lock/force-release:
    post:
      operationId: forceReleaseDocumentLock
      tags: [VersionConcurrency]
      summary: 强制释放文件级租约锁
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForceReleaseDocumentLockRequest"
      responses:
        "200":
          description: 锁已被强制释放。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLockResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/shares:
    post:
      operationId: createShare
      tags: [Sharing]
      summary: 创建内部共享
      description: 共享不复制文件内容；创建者必须对源资源具备 SHARE 权限，且共享动作只能是 READ_METADATA/PREVIEW/DOWNLOAD/WRITE_CONTENT 的子集。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: 共享已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/shares/created:
    get:
      operationId: listCreatedShares
      tags: [Sharing]
      summary: 分页查询我创建的共享
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: 我创建的共享列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }

  /api/v1/shares/received:
    get:
      operationId: listReceivedShares
      tags: [Sharing]
      summary: 分页查询共享给我的资源
      description: 包含直接共享给当前用户、当前用户所属组织以及登录态内部链接共享。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: 共享给我的列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }

  /api/v1/shares/{shareId}:
    get:
      operationId: getShare
      tags: [Sharing]
      summary: 获取共享详情
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ShareIdPath"
      responses:
        "200":
          description: 共享详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateShare
      tags: [Sharing]
      summary: 修改共享动作和有效期
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ShareIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShareRequest"
      responses:
        "200":
          description: 共享已更新。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/shares/{shareId}/revoke:
    post:
      operationId: revokeShare
      tags: [Sharing]
      summary: 撤销共享
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ShareIdPath"
      requestBody:
