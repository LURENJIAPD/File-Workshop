    post:
      operationId: revokeAdminDelegation
      tags: [AdministrationDelegation]
      summary: 撤销管理委派
      description: 撤销后所有后代委派立即失效。
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RevokeAdminDelegationRequest" } } }
      responses:
        "200":
          description: 委派已撤销。
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminDelegationResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/administrators:
    parameters: [{ $ref: "#/components/parameters/OrganizationIdPath" }]
    get:
      operationId: listOrganizationAdministrators
      tags: [AdministrationDelegation]
