      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDirectoryEntryRequest"
      responses:
        "200":
          description: 目录项已重命名。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/entries/{entryId}/move:
    post:
      operationId: moveDirectoryEntry
      tags: [FileDirectory]
      summary: 移动目录项
      description: 根文件夹不可移动；文件夹不能移动到自身或后代目录；移动会使空间权限安全版本递增以失效继承权限缓存。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveDirectoryEntryRequest"
      responses:
        "200":
          description: 目录项已移动。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/entries/{entryId}/trash:
    post:
      operationId: trashDirectoryEntry
      tags: [Lifecycle]
      summary: 将目录项移入回收站
      description: 根文件夹不可回收；文件夹回收会隐藏整棵子树。删除时间写入 recycle_items，namespace_entries.deleted_at 仅用于 PURGING/PURGED。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashDirectoryEntryRequest"
      responses:
        "201":
          description: 目录项已进入回收站。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecycleItemResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/recycle-bin:
    get:
      operationId: listRecycleBinItems
      tags: [Lifecycle]
      summary: 分页查询可见回收站条目
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: spaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 回收站条目列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecycleItemListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/recycle-bin/{recycleItemId}/restore:
    post:
      operationId: restoreRecycleItem
      tags: [Lifecycle]
      summary: 恢复回收站条目
      description: 默认恢复到原父目录；原父目录不可用或出现同名冲突时，可显式传入 targetParentFolderId 和 name。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecycleItemIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRecycleItemRequest"
      responses:
        "200":
          description: 回收站条目已恢复。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecycleItemResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/recycle-bin/{recycleItemId}/purge:
    post:
      operationId: purgeRecycleItem
      tags: [Lifecycle]
      summary: 请求永久清理回收站条目
      description: 本周期只把回收项和命名空间子树标记为 PURGING，并写入 Outbox；对象存储清理由后台任务后续完成。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecycleItemIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeRecycleItemRequest"
      responses:
        "200":
          description: 永久清理已进入 PURGING 状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecycleItemResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/lifecycle/recycle-bin/expired/scan:
    post:
      operationId: scanExpiredRecycleItems
      tags: [Lifecycle]
      summary: Scan expired recycle bin items and enqueue purge jobs
      description: SYSTEM_ADMIN operation. It scans ACTIVE recycle items whose expiresAt has passed and enqueues LIFECYCLE_PURGE background jobs. It does not delete object storage data directly.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanExpiredRecycleItemsRequest"
      responses:
        "200":
          description: Expired recycle items have been scanned and eligible purge jobs have been enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanExpiredRecycleItemsResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/documents/{documentId}/preservation-holds:
    post:
      operationId: placePreservationHold
      tags: [Lifecycle]
      summary: Place preservation hold on a document
      description: SYSTEM_ADMIN operation. It creates a preservation hold backed by legal_holds and prevents lifecycle purge while ACTIVE.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacePreservationHoldRequest"
      responses:
        "201":
          description: Preservation hold has been placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreservationHoldResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/preservation-holds:
    get:
      operationId: listPreservationHolds
      tags: [Lifecycle]
      summary: List preservation holds
      description: SYSTEM_ADMIN operation. Pagination uses page and pageSize.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: documentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PreservationHoldStatus" }
        - name: caseReference
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Preservation hold list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreservationHoldListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/preservation-holds/{preservationHoldId}:
    get:
      operationId: getPreservationHold
      tags: [Lifecycle]
      summary: Get preservation hold detail
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PreservationHoldIdPath"
      responses:
        "200":
          description: Preservation hold detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreservationHoldResponse"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/preservation-holds/{preservationHoldId}/release:
    post:
      operationId: releasePreservationHold
      tags: [Lifecycle]
      summary: Release preservation hold
      description: SYSTEM_ADMIN operation. It releases an ACTIVE preservation hold with rowVersion concurrency check and keeps the historical row.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PreservationHoldIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleasePreservationHoldRequest"
      responses:
        "200":
          description: Preservation hold has been released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreservationHoldResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/search:
    get:
      operationId: searchDirectoryEntries
      tags: [Search]
      summary: 搜索文件夹、文件名和文档元数据
      description: >-
        当前周期仅基于 PostgreSQL 搜索 ACTIVE 目录项的名称、扩展名、分类和指定 metadata key/value。
        全文、OCR 和语义搜索暂未启用。搜索结果返回前必须执行 READ_METADATA 最终授权复核。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: query
          in: query
          required: false
          description: 搜索关键词，匹配文件夹/文件名称、规范化名称、扩展名和分类。
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: spaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: entryType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DirectoryEntryType" }
        - name: extension
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: classification
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: createdByUserId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: updatedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: updatedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: metadataKey
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: metadataValue
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: 搜索结果。当前 total 为本页可见数量，不代表跨页精确总数。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/search/index-refresh-jobs:
    post:
      operationId: enqueueSearchIndexRefreshJobs
      tags: [Search]
      summary: Enqueue search index refresh jobs for documents.
      description: >-
        SYSTEM_ADMIN operation. It marks document_index_states as PENDING and enqueues INDEX background jobs.
        The current cycle only schedules refresh work; it does not parse file content, run OCR, or change search degraded mode.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueSearchIndexRefreshJobsRequest"
      responses:
        "200":
          description: Search index refresh enqueue results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueSearchIndexRefreshJobsResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: 轮换 Refresh Token 并签发新访问令牌
      description: >-
        需要 file_workshop_refresh Cookie。每次成功调用都会作废旧 Token 并设置下一代 Token；
        检测到旧 Token 重用时吊销整个 Session 和活动 Token 家族。
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refresh Token 轮换成功。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: 注销当前会话
      description: 使用访问 Cookie、Bearer Token 或 Refresh Token 定位并吊销当前会话，同时清除认证 Cookie。重复注销保持成功。
      security:
        - bearerAuth: []
        - sessionCookie: []
        - refreshCookie: []
      responses:
        "204":
          description: 当前会话已注销或原本已失效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
        "403":
          $ref: "#/components/responses/SecurityRejected"

  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      tags: [Authentication]
      summary: 获取当前认证会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前访问令牌及数据库会话均有效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: 获取当前用户资料
      security:
        - bearerAuth: []
