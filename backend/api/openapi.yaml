          content: { application/json: { schema: { $ref: "#/components/schemas/PermissionGrantResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/permissions/grants/{grantId}:
    parameters: [{ $ref: "#/components/parameters/GrantIdPath" }]
    patch:
      operationId: updatePermissionGrant
      tags: [Permissions]
      summary: 修改资源授权
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
