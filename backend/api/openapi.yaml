openapi: 3.1.0
info:
  title: File Workshop API
  version: 0.1.0
  description: File Workshop V1.0 REST API 工作契约。业务 API 使用 /api/v1，平台健康检查为部署探针例外。
servers:
  - url: /

tags:
  - name: Health
    description: 应用存活与就绪探针，不产生业务审计事件。
  - name: Authentication
    description: 登录、会话检查、Refresh Token 轮换和注销；只建立身份上下文，不判断文件资源权限。
  - name: Users
    description: 当前用户资料和本人会话管理。
  - name: UserAdministration
    description: SYSTEM_ADMIN 用户生命周期管理；所有写操作执行资源级授权和并发校验。
  - name: Organizations
    description: 当前用户可见的组织关系和个人空间；成员关系本身不授予文件权限。
  - name: OrganizationAdministration
    description: SYSTEM_ADMIN 维护组织树、成员关系和受控重组计划。
  - name: SpaceAdministration
    description: SYSTEM_ADMIN 维护个人、组织和公共空间的容量、配置与状态。
  - name: AdministrationDelegation
    description: 组织及其子树的管理能力委派；管理委派与普通文件 ACL 严格分离。
  - name: Permissions
    description: 全系统唯一资源授权判定入口；采用显式允许、继承和默认拒绝，不支持显式 DENY。
  - name: FileDirectory
    description: 文件夹树、Document 稳定身份和统一目录命名空间；不处理对象存储上传下载数据面。

  - name: BackgroundAdministration
    description: SYSTEM_ADMIN background job and Outbox operations.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: 检查进程是否存活
      description: 只确认 HTTP 进程能够响应，不访问外部依赖。
      responses:
        "200":
          description: 进程存活。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: 检查节点是否可以接收流量
      description: PostgreSQL 是必需依赖；Redis 故障时允许降级；对象存储暂缓期间明确报告 disabled。当前组件键名固定为 postgresql、redis、objectStorage。
      responses:
        "200":
          description: 节点就绪；响应 status 可能为 ok 或 degraded。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 必需依赖不可用，节点未就绪。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: 使用用户名和密码登录
      description: >-
        成功后返回短期 Bearer 访问令牌，并设置访问 Cookie 和只用于刷新/注销的 Refresh Token Cookie。
        Refresh Token 不进入响应正文，数据库只保存其 SHA-256 摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，会话和第一代 Refresh Token 已在同一事务创建。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/spaces/{spaceId}/entries:
    get:
      operationId: listDirectoryEntries
      tags: [FileDirectory]
      summary: 分页列出目录项
      description: 省略 parentFolderId 时列出空间根目录子项；若空间根目录尚未初始化且没有内容，返回空列表。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SpaceIdPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: parentFolderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: entryType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DirectoryEntryType" }
        - name: lifecycleStatus
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DirectoryLifecycleStatus" }
      responses:
        "200":
          description: 目录项列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryListResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/spaces/{spaceId}/folders:
    post:
      operationId: createFolder
      tags: [FileDirectory]
      summary: 创建文件夹
      description: 省略 parentFolderId 时在空间根目录下创建；必要时同事务初始化空间根文件夹。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SpaceIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: 文件夹已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/spaces/{spaceId}/documents:
    post:
      operationId: createDocument
      tags: [FileDirectory]
      summary: 创建 Document 稳定身份
      description: 当前只创建文档目录身份和元数据，占位文档 availabilityStatus 为 BLOCKED；实际版本和对象存储内容由后续上传模块写入。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SpaceIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Document 身份已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/entries/{entryId}:
    get:
      operationId: getDirectoryEntry
      tags: [FileDirectory]
      summary: 获取目录项详情
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryIdPath"
      responses:
        "200":
          description: 目录项详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameDirectoryEntry
      tags: [FileDirectory]
      summary: 重命名目录项
      description: 根文件夹不可重命名；同一父目录下 ACTIVE/ARCHIVED 名称保持唯一。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDirectoryEntryRequest"
      responses:
        "200":
          description: 目录项已重命名。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/entries/{entryId}/move:
    post:
      operationId: moveDirectoryEntry
      tags: [FileDirectory]
      summary: 移动目录项
      description: 根文件夹不可移动；文件夹不能移动到自身或后代目录；移动会使空间权限安全版本递增以失效继承权限缓存。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveDirectoryEntryRequest"
      responses:
        "200":
          description: 目录项已移动。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntryResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: 轮换 Refresh Token 并签发新访问令牌
      description: >-
        需要 file_workshop_refresh Cookie。每次成功调用都会作废旧 Token 并设置下一代 Token；
        检测到旧 Token 重用时吊销整个 Session 和活动 Token 家族。
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refresh Token 轮换成功。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: 注销当前会话
      description: 使用访问 Cookie、Bearer Token 或 Refresh Token 定位并吊销当前会话，同时清除认证 Cookie。重复注销保持成功。
      security:
        - bearerAuth: []
        - sessionCookie: []
        - refreshCookie: []
      responses:
        "204":
          description: 当前会话已注销或原本已失效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
        "403":
          $ref: "#/components/responses/SecurityRejected"

  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      tags: [Authentication]
      summary: 获取当前认证会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前访问令牌及数据库会话均有效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: 获取当前用户资料
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户资料。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: 修改当前用户资料
      description: 只允许修改显示名称、邮箱、电话、语言和时区，使用 rowVersion 防止覆盖并发更新。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserRequest"
      responses:
        "200":
          description: 资料已更新。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/me/sessions:
    get:
      operationId: listCurrentUserSessions
      tags: [Users]
      summary: 分页查询当前用户会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: 当前用户会话列表，包含活动和历史会话。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/v1/users/me/sessions/{sessionId}:
    delete:
      operationId: revokeCurrentUserSession
      tags: [Users]
      summary: 撤销当前用户的一条会话
      description: 只能撤销属于当前用户的会话；重复撤销保持成功。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "204":
          description: 会话已撤销或原本已经失效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [UserAdministration]
      summary: 分页查询用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: systemRole
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SystemRole"
      responses:
        "200":
          description: 用户列表，按创建时间和 userId 稳定倒序。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [UserAdministration]
      summary: 创建本地密码用户
      description: 用户、PASSWORD 凭据、安全版本、Outbox 和幂等结果在同一事务写入。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 用户已创建。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              description: 新用户资源路径。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/{userId}:
    get:
      operationId: getUser
      tags: [UserAdministration]
      summary: 获取用户详情
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: 用户详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [UserAdministration]
      summary: 修改用户资料或系统角色
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 用户已更新。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteUser
      tags: [UserAdministration]
      summary: 逻辑删除用户
      description: 用户名永久保留；凭据和会话在同一事务撤销，不物理删除关联业务事实。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "204":
          description: 用户已逻辑删除。
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/{userId}/disable:
    post:
      operationId: disableUser
      tags: [UserAdministration]
      summary: 禁用用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "200":
          description: 用户已禁用且活动会话已撤销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/users/{userId}/enable:
    post:
      operationId: enableUser
      tags: [UserAdministration]
      summary: 启用或解除锁定用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "200":
          description: 用户已启用。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/users/{userId}/lock:
    post:
      operationId: lockUser
      tags: [UserAdministration]
      summary: 管理员锁定用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "200":
          description: 用户已锁定且活动会话已撤销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/users/{userId}/password:
    put:
      operationId: resetUserPassword
      tags: [UserAdministration]
      summary: 管理员重置本地用户密码
