      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyHeader" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAdminDelegationRequest" } } }
      responses:
        "201":
          description: 委派已创建。
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminDelegationResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin-delegations/{delegationId}:
    parameters: [{ $ref: "#/components/parameters/DelegationIdPath" }]
    get:
      operationId: getAdminDelegation
