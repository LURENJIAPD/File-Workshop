openapi: 3.1.0
info:
  title: File Workshop API
  version: 0.1.0
  description: File Workshop V1.0 REST API 工作契约。业务 API 使用 /api/v1，平台健康检查为部署探针例外。
servers:
  - url: /

tags:
  - name: Health
    description: 应用存活与就绪探针，不产生业务审计事件。
  - name: Authentication
    description: 登录、会话检查、Refresh Token 轮换和注销；只建立身份上下文，不判断文件资源权限。
  - name: Users
    description: 当前用户资料和本人会话管理。
  - name: UserAdministration
    description: SYSTEM_ADMIN 用户生命周期管理；所有写操作执行资源级授权和并发校验。

paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: 检查进程是否存活
      description: 只确认 HTTP 进程能够响应，不访问外部依赖。
      responses:
        "200":
          description: 进程存活。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: 检查节点是否可以接收流量
      description: PostgreSQL 是必需依赖；Redis 故障时允许降级；MinIO 暂缓期间明确报告 disabled。
      responses:
        "200":
          description: 节点就绪；响应 status 可能为 ok 或 degraded。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 必需依赖不可用，节点未就绪。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: 使用用户名和密码登录
      description: >-
        成功后返回短期 Bearer 访问令牌，并设置访问 Cookie 和只用于刷新/注销的 Refresh Token Cookie。
        Refresh Token 不进入响应正文，数据库只保存其 SHA-256 摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，会话和第一代 Refresh Token 已在同一事务创建。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: 轮换 Refresh Token 并签发新访问令牌
      description: >-
        需要 file_workshop_refresh Cookie。每次成功调用都会作废旧 Token 并设置下一代 Token；
        检测到旧 Token 重用时吊销整个 Session 和活动 Token 家族。
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refresh Token 轮换成功。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: 注销当前会话
      description: 使用访问 Cookie、Bearer Token 或 Refresh Token 定位并吊销当前会话，同时清除认证 Cookie。重复注销保持成功。
      security:
        - bearerAuth: []
        - sessionCookie: []
        - refreshCookie: []
      responses:
        "204":
          description: 当前会话已注销或原本已失效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
        "403":
          $ref: "#/components/responses/SecurityRejected"

  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      tags: [Authentication]
      summary: 获取当前认证会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前访问令牌及数据库会话均有效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: 获取当前用户资料
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户资料。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: 修改当前用户资料
      description: 只允许修改显示名称、邮箱、电话、语言和时区，使用 rowVersion 防止覆盖并发更新。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserRequest"
      responses:
        "200":
          description: 资料已更新。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/me/sessions:
    get:
      operationId: listCurrentUserSessions
      tags: [Users]
      summary: 分页查询当前用户会话
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: 当前用户会话列表，包含活动和历史会话。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/v1/users/me/sessions/{sessionId}:
    delete:
      operationId: revokeCurrentUserSession
      tags: [Users]
      summary: 撤销当前用户的一条会话
      description: 只能撤销属于当前用户的会话；重复撤销保持成功。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "204":
          description: 会话已撤销或原本已经失效。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/SecurityRejected"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [UserAdministration]
      summary: 分页查询用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: systemRole
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SystemRole"
      responses:
        "200":
          description: 用户列表，按创建时间和 userId 稳定倒序。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [UserAdministration]
      summary: 创建本地密码用户
      description: 用户、PASSWORD 凭据、安全版本、Outbox 和幂等结果在同一事务写入。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 用户已创建。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              description: 新用户资源路径。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/{userId}:
    get:
      operationId: getUser
      tags: [UserAdministration]
      summary: 获取用户详情
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: 用户详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [UserAdministration]
      summary: 修改用户资料或系统角色
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 用户已更新。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteUser
      tags: [UserAdministration]
      summary: 逻辑删除用户
      description: 用户名永久保留；凭据和会话在同一事务撤销，不物理删除关联业务事实。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "204":
          description: 用户已逻辑删除。
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/{userId}/disable:
    post:
      operationId: disableUser
      tags: [UserAdministration]
      summary: 禁用用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "200":
          description: 用户已禁用且活动会话已撤销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/users/{userId}/enable:
    post:
      operationId: enableUser
      tags: [UserAdministration]
      summary: 启用或解除锁定用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "200":
          description: 用户已启用。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/users/{userId}/lock:
    post:
      operationId: lockUser
      tags: [UserAdministration]
      summary: 管理员锁定用户
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateChangeRequest"
      responses:
        "200":
          description: 用户已锁定且活动会话已撤销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/users/{userId}/password:
    put:
      operationId: resetUserPassword
      tags: [UserAdministration]
      summary: 管理员重置本地用户密码
      description: 使用模块 01 密码策略生成 Argon2id 哈希；不实施密码历史限制，成功后撤销全部活动会话。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "204":
          description: 密码已重置，活动会话已撤销。
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 短期访问 JWT。浏览器不应将其持久化到 LocalStorage。
    sessionCookie:
      type: apiKey
      in: cookie
      name: file_workshop_access
      description: 浏览器短期访问 JWT Cookie，使用 HttpOnly 和 SameSite；生产环境必须使用 Secure。
    refreshCookie:
      type: apiKey
      in: cookie
      name: file_workshop_refresh
      description: 只用于刷新和注销的轮换 Refresh Token Cookie，使用 HttpOnly 和 SameSite；生产环境必须使用 Secure。

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: 从 1 开始的页码。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      description: 每页数量，最大 200。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 可重试写请求的稳定幂等键。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    RequestId:
      description: 本次请求的稳定追踪标识。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuthSetCookie:
      description: 可能出现多次，分别设置或清除访问 Cookie 和 Refresh Token Cookie。
      schema:
        type: string
    NoStore:
      description: 认证响应不得被共享或浏览器缓存保存。
      schema:
        type: string
        const: no-store

  responses:
    InvalidRequest:
      description: 请求 JSON 或字段不符合契约。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthRequired:
      description: 未提供有效认证信息、访问令牌过期或会话已经失效。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: 用户名或密码错误；响应不区分用户是否存在。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountLocked:
      description: 账号被管理员锁定，或在锁定窗口内连续失败次数达到阈值。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecurityRejected:
      description: 浏览器请求的 Origin 不在允许列表中，拒绝可能的跨站请求伪造。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: IP 或账号短时间请求过多。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: 建议重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 当前用户没有执行该管理操作的权限。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在或对当前用户不可见。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 唯一值、幂等键、用户状态或 rowVersion 发生冲突。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
        deviceId:
          type: string
          minLength: 1
          maxLength: 256

    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, systemRole, locale, timezone]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        systemRole:
          type: string
          enum: [USER, SYSTEM_ADMIN]
        locale:
          type: string
          minLength: 1
          maxLength: 16
        timezone:
          type: string
          minLength: 1
          maxLength: 64

    SystemRole:
      type: string
      enum: [USER, SYSTEM_ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED, DELETED]

    User:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, systemRole, status, locale, timezone, createdAt, updatedAt, rowVersion]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 128
        employeeNo:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 256
        phone:
          type: string
          minLength: 1
          maxLength: 64
        systemRole:
          $ref: "#/components/schemas/SystemRole"
        status:
